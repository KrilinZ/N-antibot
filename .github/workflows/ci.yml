name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Real servers, so the end-to-end tests run instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y nginx caddy apache2 nftables
      - run: pip install -e . pytest ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q -rs
      - run: node --test tests/node/n-antibot.test.mjs
