# Example: a site protected by N-antibot.
http {
	# 1. Once, inside http { }.
	include /etc/nginx/n-antibot.conf;

	server {
		listen 443 ssl;
		server_name example.com;

		# 2. In every server you want to protect. 444 closes the connection without answering.
		if ($n_antibot_block) { return 444; }

		location / {
			proxy_pass http://127.0.0.1:3000;
		}
	}
}
